name: Website (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        working-directory: web
        env:
          VITE_GIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build
      - name: Add newest region pack (display files only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for region in jakarta; do
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
              --jq "[.[] | select(.isDraft | not) | select(.tagName | startswith(\"region-${region}-\"))] | sort_by(.createdAt) | last | .tagName // empty")
            if [ -z "$tag" ]; then echo "no region pack yet for $region"; continue; fi
            dest="web/dist/data/${region}"
            mkdir -p "$dest"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D "$dest" -p '*.pmtiles' -p manifest.json -p verify-report.json -p SHA256SUMS -p data-check.json -p 'engine_*.bin.gz' -p 'engine_*.json' -p 'exposure_*.bin.gz' -p 'exposure_*.json'
            echo "{\"tag\": \"$tag\"}" > "$dest/release.json"
            du -sh "$dest"
          done
          du -sh web/dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
