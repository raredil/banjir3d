name: DEMNAS ingest (private)

# Reads the owner's DEMNAS upload from the DRAFT release 'demnas-private', checks the tile list,
# builds one 8 m mosaic and puts it back into the same draft release. Nothing is made public.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python demnas_ingest.py jakarta
