name: Probe sources

# Checks two sources the cloud session cannot reach (verification/geoportal/probe.py): the Jakarta Satu ArcGIS REST directory
# (drains, catchments, AWLR gauges) and the Zenodo "Sinking City" subsidence record. Read-only; the answers stay in a
# 7-day workflow artifact (licences not yet known, so nothing is published).
on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "ccr-**"]
    paths: ["verification/geoportal/probe.py", ".github/workflows/probe.yml"]

permissions:
  contents: read

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install numpy==2.5.4 rasterio==1.5.2
      - run: python verification/geoportal/probe.py "$RUNNER_TEMP/probe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe
          path: ${{ runner.temp }}/probe/summary.json
          retention-days: 7
