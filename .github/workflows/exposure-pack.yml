name: Exposure pack

# Buildings, people and kecamatan per 30 m model cell (pipeline/exposure_pack.py), so the app counts what a flood reaches.
# Publishes a copy of the newest region pack plus exposure_<region>.bin.gz / .json, then redeploys the website.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id from data/regions.json"
        default: "jakarta"
        required: true
  push:
    branches: ["claude/**", "ccr-**"]
    paths: ["pipeline/exposure_pack.py", ".github/workflows/exposure-pack.yml"]

permissions:
  contents: read

concurrency:
  group: region-pack-jakarta
  cancel-in-progress: false

jobs:
  exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      REGION: ${{ inputs.region || 'jakarta' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Download newest region pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REGION" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad region"; exit 1; }
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
            --jq "[.[] | select(.isDraft | not) | select(.tagName | startswith(\"region-${REGION}-\"))] | sort_by(.createdAt) | last | .tagName // empty")
          case "$tag" in region-"$REGION"-*) ;; *) echo "::error::no region pack release for $REGION"; exit 1 ;; esac
          echo "SRC_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pack"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/pack" && sha256sum -c SHA256SUMS && rm -f exposure_*
      - name: Build exposure pack (Overture divisions from AWS S3)
        working-directory: pipeline
        run: |
          python exposure_pack.py "$RUNNER_TEMP/pack" "$RUNNER_TEMP/exposure" --region "$REGION"
          cp "$RUNNER_TEMP"/exposure/exposure_* "$RUNNER_TEMP/pack/"
          cd "$RUNNER_TEMP/pack" && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && ls -la
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="region-${REGION}-$(date -u +%Y%m%d)-x${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP"/pack/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Region pack: ${REGION} ($(date -u +%Y-%m-%d), with exposure pack)" \
            --notes "Copy of ${SRC_TAG} plus buildings, people and kecamatan per model cell (exposure_${REGION}.bin.gz, provenance and checks in exposure_${REGION}.json). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Redeploy website with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
