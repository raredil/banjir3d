name: Release permission test

# Diagnoses HTTP 403 on 'gh release create' (2026-11-01): which call is refused. Creates and deletes test objects only.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["verification/terrain/release_test.txt"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          t="permtest-${GITHUB_RUN_ID}"
          echo "1 tag ref:"; gh api "repos/$R/git/refs" -f ref="refs/tags/$t" -f sha="$GITHUB_SHA" --jq .ref 2>&1 || true
          gh api -X DELETE "repos/$R/git/refs/tags/$t" 2>&1 || true
          echo "2 draft release:"; id=$(gh api "repos/$R/releases" -f tag_name="$t-d" -f target_commitish="$GITHUB_SHA" -F draft=true --jq .id 2>&1); echo "$id"
          [[ "$id" =~ ^[0-9]+$ ]] && gh api -X DELETE "repos/$R/releases/$id"
          echo "3 release on main:"; id=$(gh api "repos/$R/releases" -f tag_name="$t-m" -f target_commitish=main --jq .id 2>&1); echo "$id"
          [[ "$id" =~ ^[0-9]+$ ]] && gh api -X DELETE "repos/$R/releases/$id"
          gh api -X DELETE "repos/$R/git/refs/tags/$t-m" 2>/dev/null || true
          echo "4 release on this commit:"; id=$(gh api "repos/$R/releases" -f tag_name="$t-c" -f target_commitish="$GITHUB_SHA" --jq .id 2>&1); echo "$id"
          [[ "$id" =~ ^[0-9]+$ ]] && gh api -X DELETE "repos/$R/releases/$id"
          gh api -X DELETE "repos/$R/git/refs/tags/$t-c" 2>/dev/null || true
          echo "5 rulesets:"; gh api "repos/$R/rulesets" 2>&1 | head -c 600 || true
          echo; echo "6 immutable releases:"; gh api "repos/$R/immutable-releases" 2>&1 | head -c 300 || true
