name: Region pack

# Downloads and prepares all map layers for one region, then publishes them as a GitHub release
# (COG + GeoPackage/GeoParquet for analysis, PMTiles for the web map, manifest.json = provenance).
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id from data/regions.json"
        default: "jakarta"
        required: true

permissions:
  contents: read

concurrency:
  group: region-pack-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        group: [dem, landcover, water, buildings, people, imagery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - if: matrix.group == 'water'
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Build ${{ matrix.group }}
        working-directory: pipeline
        run: python region_pack.py build "$REGION" "${{ matrix.group }}" --out "$RUNNER_TEMP/pack"
        env:
          REGION: ${{ inputs.region }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack-${{ matrix.group }}
          path: ${{ runner.temp }}/pack
          retention-days: 3
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        run: python verify_sources.py "$RUNNER_TEMP/verify-report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify
          path: ${{ runner.temp }}/verify-report.json

  publish:
    needs: [build, verify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/art
      - name: Merge layers and provenance
        working-directory: pipeline
        env:
          REGION: ${{ inputs.region }}
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          find "$RUNNER_TEMP/art" -type f -exec mv -t "$RUNNER_TEMP/pack" {} +
          python region_pack.py merge "$REGION" --out "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/pack" && sha256sum -- * > SHA256SUMS && ls -la
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REGION: ${{ inputs.region }}
        run: |
          tag="region-${REGION}-$(date -u +%Y%m%d)-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP"/pack/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Region pack: ${REGION} ($(date -u +%Y-%m-%d))" \
            --notes "Automatic region pack. Provenance: manifest.json. Source check: verify-report.json. Checksums: SHA256SUMS. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Redeploy website with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
