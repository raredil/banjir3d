name: Engine pack

# Builds the flood-engine inputs (pipeline/engine_pack.py): conditioned terrain with mapped channels, Manning n and NRCS curve
# number from the newest land cover and SoilGrids soil groups, sea mask and the upstream stream network (GLO-90 + Overture/OSM).
# Publishes them with a copy of the newest region pack as a new region pack release, then redeploys the website.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id from data/regions.json"
        default: "jakarta"
        required: true
  push:
    branches: ["claude/**"]
    paths: ["pipeline/engine_pack.py", "data/engine/**", ".github/workflows/engine-pack.yml"]

permissions:
  contents: read

concurrency:
  group: region-pack-jakarta
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    env:
      REGION: ${{ inputs.region || 'jakarta' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt scipy==1.18.1 pysheds==0.5
      - name: Download newest region pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
            --jq "[.[] | select(.isDraft | not) | select(.tagName | startswith(\"region-${REGION}-\"))] | sort_by(.createdAt) | last | .tagName // empty")
          case "$tag" in region-"$REGION"-*) ;; *) echo "::error::no region pack release for $REGION"; exit 1 ;; esac
          echo "SRC_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pack"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/pack" && sha256sum -c SHA256SUMS && rm -f engine_*
      - name: Build engine pack (SoilGrids over HTTPS)
        run: |
          python pipeline/engine_pack.py "$RUNNER_TEMP/pack" "$RUNNER_TEMP/engine" --region "$REGION" --soil soilgrids
          cp "$RUNNER_TEMP"/engine/engine_* "$RUNNER_TEMP/pack/"
          cd "$RUNNER_TEMP/pack" && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && ls -la
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="region-${REGION}-$(date -u +%Y%m%d)-e${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$RUNNER_TEMP"/pack/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Region pack: ${REGION} ($(date -u +%Y-%m-%d), with engine pack)" \
            --notes "Copy of ${SRC_TAG} plus the flood-engine inputs (engine_${REGION}.bin.gz, provenance and checks in engine_${REGION}.json). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Redeploy website with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
