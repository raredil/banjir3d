name: Map layers

# Jakarta Satu (Dinas SDA DKI: drains, pumps, polders, walls, official flood polygons per RT) and PetaBencana citizen reports
# of the validation events as map layers (pipeline/map_layers.py, owner decision ADR 0014). Also writes the DEMNAS and
# subsidence tiles into manifest.json so the map can switch them on. Publishes a copy of the newest region pack plus these
# files as a new region pack release, then redeploys the website.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region id from data/regions.json"
        default: "jakarta"
        required: true
  push:
    branches: ["claude/**"]
    paths: ["pipeline/map_layers.py", ".github/workflows/map-layers.yml"]

permissions:
  contents: read

concurrency:
  group: region-pack-jakarta
  cancel-in-progress: false

jobs:
  layers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      REGION: ${{ inputs.region || 'jakarta' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Download newest region pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REGION" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad region"; exit 1; }
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,createdAt \
            --jq "[.[] | select(.isDraft | not) | select(.tagName | startswith(\"region-${REGION}-\"))] | sort_by(.createdAt) | last | .tagName // empty")
          case "$tag" in region-"$REGION"-*) ;; *) echo "::error::no region pack release for $REGION"; exit 1 ;; esac
          echo "SRC_TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pack"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/pack" && sha256sum -c SHA256SUMS
      - name: Fetch Jakarta Satu and PetaBencana
        run: |
          python pipeline/jakartasatu.py "$RUNNER_TEMP/js"
          python verification/observed/fetch.py "$RUNNER_TEMP/pb" --petabencana-only
      - name: Build map layers
        working-directory: pipeline
        run: |
          python map_layers.py "$RUNNER_TEMP/js/jakartasatu.gpkg" "$RUNNER_TEMP/pb" "$RUNNER_TEMP/pack"
          cp "$RUNNER_TEMP/js/jakartasatu.json" "$RUNNER_TEMP/pack/"
          cd "$RUNNER_TEMP/pack" && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && ls -la
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="region-${REGION}-$(date -u +%Y%m%d)-m${GITHUB_RUN_NUMBER}"
          "$GITHUB_WORKSPACE/.github/scripts/release.sh" create "$tag" "$GITHUB_SHA" "Region pack: ${REGION} ($(date -u +%Y-%m-%d), with Jakarta Satu and PetaBencana map layers)" \
            "Copy of ${SRC_TAG} plus jakartasatu.pmtiles/.gpkg (Jakarta Satu, Dinas Sumber Daya Air Provinsi DKI Jakarta) and reports_petabencana.pmtiles/.geojson (PetaBencana.id), published by owner decision (ADR 0014). Provenance in map_layers.json. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$RUNNER_TEMP"/pack/*
      - name: Redeploy website with the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
